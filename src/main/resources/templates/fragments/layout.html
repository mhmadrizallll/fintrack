<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <style>
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .logo svg {
      width: 25px;
      height: 25px;
    }
  </style>
  <body>
    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar" th:fragment="sidebar" id="fintrackSidebar">
      <!-- CLOSE BUTTON MOBILE -->
      <button
        type="button"
        class="sidebar-close"
        onclick="toggleSidebar()"
        aria-label="Tutup menu"
      >
        ×
      </button>

      <!-- BRAND -->
      <div class="sidebar-brand">
        <div class="logo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="3"
              stroke="currentColor"
              stroke-width="2"
            />

            <path
              d="M7 15L10 12L13 14L17 9"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M16 9H18V11"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <div>
          <div class="brand-name">FinTrack</div>
          <div class="brand-subtitle">Financial Management</div>
        </div>
      </div>

      <!-- =====================================================
           NAVIGATION
           ===================================================== -->

      <nav class="sidebar-nav">
        <!-- ===================================================
             MAIN
             =================================================== -->

        <div class="nav-section">
          <div class="nav-section-title">Main</div>

          <!-- DASHBOARD -->
          <a
            th:href="@{/dashboard}"
            class="nav-item"
            th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''"
            onclick="closeSidebarOnMobile()"
          >
            <span class="nav-icon">🏠</span>
            <span>Dashboard</span>
          </a>
        </div>

        <!-- ===================================================
             FINANCE
             =================================================== -->

        <div class="nav-section">
          <div class="nav-section-title">Finance</div>

          <!-- TRANSACTIONS -->
          <a
            th:href="@{/transactions}"
            class="nav-item"
            th:classappend="${activeMenu == 'transactions'} ? ' active' : ''"
            onclick="closeSidebarOnMobile()"
          >
            <span class="nav-icon">💰</span>
            <span>Transactions</span>
          </a>

          <!-- CATEGORIES
               ADMIN ONLY -->
          <a
            th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
            th:href="@{/admin/categories}"
            class="nav-item"
            th:classappend="${activeMenu == 'categories'} ? ' active' : ''"
            onclick="closeSidebarOnMobile()"
          >
            <span class="nav-icon">🏷️</span>
            <span>Categories</span>
          </a>

          <!-- FUND SOURCES
               ADMIN ONLY -->
          <a
            th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
            th:href="@{/admin/fund-sources}"
            class="nav-item"
            th:classappend="${activeMenu == 'fund-sources'} ? ' active' : ''"
            onclick="closeSidebarOnMobile()"
          >
            <span class="nav-icon">💳</span>
            <span>Fund Sources</span>
          </a>
        </div>

        <!-- ===================================================
             REPORTS
             =================================================== -->

        <div class="nav-section">
          <div class="nav-section-title">Reports</div>

          <!-- DAILY REPORT -->
          <a
            th:href="@{/reports/daily}"
            class="nav-item"
            th:classappend="${activeMenu == 'daily-report'} ? ' active' : ''"
            onclick="closeSidebarOnMobile()"
          >
            <span class="nav-icon">📅</span>
            <span>Daily Report</span>
          </a>

          <!-- MONTHLY REPORT -->
          <a
            th:href="@{/reports/monthly}"
            class="nav-item"
            th:classappend="${activeMenu == 'monthly-report'} ? ' active' : ''"
            onclick="closeSidebarOnMobile()"
          >
            <span class="nav-icon">📊</span>
            <span>Monthly Report</span>
          </a>
        </div>

        <!-- ===================================================
             USERS
             ADMIN ONLY
             =================================================== -->

        <div
          class="nav-section"
          th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
        >
          <div class="nav-section-title">Users</div>

          <!-- USER MANAGEMENT -->
          <a
            th:href="@{/admin/users}"
            class="nav-item"
            th:classappend="${activeMenu == 'users'} ? ' active' : ''"
            onclick="closeSidebarOnMobile()"
          >
            <span class="nav-icon">👤</span>
            <span>User Management</span>
          </a>
        </div>
      </nav>

      <!-- =====================================================
           USER FOOTER
           ===================================================== -->

      <div class="sidebar-footer">
        <div class="user-mini">
          <div class="user-avatar">
            <span
              th:if="${#authentication != null
                            and #authentication.name != null
                            and #authentication.name.length() > 0}"
              th:text="${#strings.substring(
                            #authentication.name,
                            0,
                            1
                        ).toUpperCase()}"
            >
              A
            </span>
          </div>

          <div class="user-info">
            <div class="user-name" th:text="${#authentication.name}">admin</div>

            <!-- ROLE OTOMATIS -->
            <div
              class="user-role"
              th:text="${#authorization.expression('hasRole(''ADMIN'')')
                        ? 'Administrator'
                        : 'User'}"
            >
              User
            </div>
          </div>
        </div>

        <!-- LOGOUT -->
        <form method="post" th:action="@{/logout}">
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />

          <button type="submit" class="nav-item logout-button">
            <span class="nav-icon">🚪</span>
            <span>Logout</span>
          </button>
        </form>
      </div>
    </aside>

    <!-- =====================================================
         SIDEBAR OVERLAY MOBILE
         ===================================================== -->

    <div
      class="sidebar-overlay"
      id="sidebarOverlay"
      onclick="toggleSidebar()"
      th:fragment="mobileMenu"
    ></div>

    <!-- =====================================================
         TOPBAR
         ===================================================== -->

    <header class="topbar" th:fragment="topbar">
      <!-- MOBILE HAMBURGER -->
      <button
        type="button"
        class="mobile-menu"
        onclick="toggleSidebar()"
        aria-label="Buka menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="topbar-title">
        <div class="page-title" th:text="${pageTitle}">Dashboard</div>

        <div class="page-subtitle" th:text="${pageSubtitle}">
          Ringkasan kondisi keuangan
        </div>
      </div>

      <div class="topbar-right">
        <span class="topbar-date" id="currentDate"></span>
      </div>
    </header>

    <!-- =====================================================
         SCRIPT
         ===================================================== -->

    <script th:fragment="scripts">
      // =====================================================
      // SIDEBAR TOGGLE
      // =====================================================

      function toggleSidebar() {
        console.log("HAMBURGER DIKLIK");

        const sidebar = document.getElementById("fintrackSidebar");

        const overlay = document.getElementById("sidebarOverlay");

        console.log("sidebar:", sidebar);
        console.log("overlay:", overlay);

        if (!sidebar) {
          console.error("Sidebar tidak ditemukan!");

          return;
        }

        sidebar.classList.toggle("open");

        if (overlay) {
          overlay.classList.toggle("show");
        }

        document.body.classList.toggle(
          "sidebar-open",
          sidebar.classList.contains("open"),
        );

        console.log("Sidebar class:", sidebar.className);
      }

      // =====================================================
      // CLOSE SIDEBAR MOBILE
      // =====================================================

      function closeSidebarOnMobile() {
        if (window.innerWidth <= 768) {
          const sidebar = document.getElementById("fintrackSidebar");

          const overlay = document.getElementById("sidebarOverlay");

          if (sidebar) {
            sidebar.classList.remove("open");
          }

          if (overlay) {
            overlay.classList.remove("show");
          }

          document.body.classList.remove("sidebar-open");
        }
      }

      // =====================================================
      // CURRENT DATE
      // =====================================================

      function updateDate() {
        const element = document.getElementById("currentDate");

        if (!element) {
          return;
        }

        const now = new Date();

        element.textContent = now.toLocaleDateString("id-ID", {
          weekday: "long",
          day: "2-digit",
          month: "long",
          year: "numeric",
        });
      }

      // Jalankan saat halaman dibuka
      updateDate();
    </script>
  </body>
</html>
